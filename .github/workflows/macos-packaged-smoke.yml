name: macOS Packaged Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/backend/**"
      - "app/desktop/**"
      - "scripts/build-sidecar.mjs"
      - "scripts/smoke-sidecar.mjs"

jobs:
  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: uv sync --extra test --extra build
        working-directory: app/backend
      - run: npx playwright install chromium
      - run: npm run smoke
      - run: npm run backend:sidecar
      - run: npm run backend:sidecar:smoke
      - run: cargo build --release --locked
        working-directory: app/desktop/src-tauri
