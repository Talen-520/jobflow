<html>
  <head><title>Apply - Software Engineer II, Backend - Rippling AI</title></head>
  <body>
    <main>
      <h1>Software Engineer II, Backend</h1>
      <form>
        <label for="resume">Resume</label>
        <input id="resume" data-testid="input-resume" type="file" required />

        <label for="first-name">First name</label>
        <input id="first-name" data-testid="input-first_name" name="generated-first" required />

        <label for="last-name">Last name</label>
        <input id="last-name" data-testid="input-last_name" name="generated-last" required />

        <label for="email">Email</label>
        <input id="email" data-testid="input-email" name="generated-email" type="email" required />

        <label for="phone">Phone number</label>
        <input id="phone" data-testid="input-phone_number" name="generated-phone" type="tel" required />

        <label for="location">Location</label>
        <input id="location" data-testid="input-undefined" aria-haspopup="listbox" required />

        <label for="gender">Gender</label>
        <input id="gender" role="combobox" aria-label="Gender" />

        <label for="race">Please identify your race</label>
        <input id="race" data-testid="input-select-search-input" role="combobox" />

        <label for="hispanic">Are you Hispanic/Latino?</label>
        <input id="hispanic" role="combobox" />

        <label for="veteran">Veteran Status</label>
        <input id="veteran" role="combobox" />

        <label for="disability">Disability Status</label>
        <input id="disability" role="combobox" />

        <label for="sms-yes">Yes - I consent to receive SMS updates</label>
        <input id="sms-yes" data-testid="radio-sms_opt_in" name="sms_opt_in" type="radio" value="true" />
        <label for="sms-no">No - I do not consent to receive SMS updates</label>
        <input id="sms-no" data-testid="radio-sms_opt_in" name="sms_opt_in" type="radio" value="false" />
      </form>
    </main>
  </body>
</html>
