<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobFlow</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="brand-row">
        <div class="brand">
          <div class="mark" aria-hidden="true">J</div>
          <div>
            <h1>JobFlow</h1>
            <p>Local application assistant</p>
          </div>
        </div>
        <span class="badge" data-state="connecting" id="status">Connecting</span>
      </header>

      <section class="form-summary">
        <div class="summary-meta">
          <span class="badge badge-muted" id="ats-badge">No form</span>
          <span id="field-count">0 fields</span>
        </div>
        <h2 id="detail-title">Checking this tab</h2>
        <p id="detail">Connecting to the local JobFlow app.</p>
      </section>

      <section class="controls">
        <label class="switch-row">
          <span>
            <strong>AI answers</strong>
            <small>Use saved Profile context for open questions.</small>
          </span>
          <span class="switch">
            <input id="ai-custom-fields" type="checkbox" />
            <span aria-hidden="true"></span>
          </span>
        </label>
        <button class="button button-primary" id="start-fill" type="button" disabled>
          Start filling
        </button>
        <p aria-live="polite" id="fill-status" class="fill-status"></p>
        <div
          aria-live="polite"
          class="completion-state"
          data-state="manual"
          hidden
          id="completion-state"
        >
          <svg
            aria-hidden="true"
            class="completion-icon"
            data-icon="IoCheckmarkDoneSharp"
            fill="none"
            id="completion-icon"
            viewBox="0 0 24 24"
          >
            <path d="m1.5 12.5 4 4L13 9" />
            <path d="m9 12.5 4 4L22 7" />
          </svg>
          <span id="completion-text"></span>
        </div>
      </section>

      <footer>CAPTCHA and submit stay manual.</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
